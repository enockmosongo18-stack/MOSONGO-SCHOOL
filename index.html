<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosongo School Student Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-slip, #printable-slip * { visibility: visible; }
      #printable-slip { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_STUDENTS = Array.from({ length: 16 }, (_, i) => {
      const num = 14300 + i;
      const regNo = `${num}A`;
      const names = [
        "Brian Kiprono", "Mercy Chebet", "Kevin Omondi", "Faith Wanjiku",
        "Emmanuel Mutua", "Joy Cherotich", "Dennis Mwangi", "Anita Achieng",
        "Victor Otieno", "Grace Njeri", "Samuel Kamau", "Cynthia Akoth",
        "Daniel Hassan", "Purity Kinyua", "Moses Kipkurui", "Esther Nafula"
      ];
      return {
        id: `STU-${num}`,
        regNo: regNo,
        name: names[i],
        password: "student@001",
        program: "Diploma in Software Development & IT",
        year: 2,
        semester: 1,
        gpa: (3.2 + (i % 5) * 0.15).toFixed(2),
        attendance: 88 + (i % 10),
        feesDue: (i % 3 === 0) ? 0 : (15000 + (i * 1200)),
        feesPaid: 45000,
        registeredUnits: ["CS201", "CS202", "CS203"],
        grades: [
          { code: "CS201", name: "Data Structures & Algorithms", mark: 72 + (i % 20), grade: "A" },
          { code: "CS202", name: "Database Systems", mark: 65 + (i % 25), grade: "B" },
          { code: "CS203", name: "Web Application Development", mark: 78 + (i % 15), grade: "A" },
          { code: "CS204", name: "Cybersecurity Fundamentals", mark: 60 + (i % 30), grade: "B" }
        ],
        wellbeingStatus: "Good",
        notes: "No warnings recorded."
      };
    });

    const AVAILABLE_UNITS = [
      { code: "CS201", name: "Data Structures & Algorithms", credit: 4, lecturer: "Dr. A. Oduor" },
      { code: "CS202", name: "Database Management Systems", credit: 3, lecturer: "Prof. M. Njuguna" },
      { code: "CS203", name: "Web Application Development", credit: 4, lecturer: "Eng. E. Orangi" },
      { code: "CS204", name: "Cybersecurity Fundamentals", credit: 3, lecturer: "Dr. P. Kariuki" },
      { code: "CS205", name: "Discrete Mathematics", credit: 3, lecturer: "Dr. S. Kiptoo" },
      { code: "CS206", name: "Operating Systems & Architecture", credit: 4, lecturer: "Mr. J. Maina" }
    ];

    function App() {
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [currentStudentId, setCurrentStudentId] = useState("STU-14300");
      const [isAdmin, setIsAdmin] = useState(false);
      const [activeTab, setActiveTab] = useState("dashboard");
      const [paymentAmount, setPaymentAmount] = useState("");
      const [editingGradeIndex, setEditingGradeIndex] = useState(null);
      const [editMarkValue, setEditMarkValue] = useState("");

      const currentStudent = useMemo(() => {
        return students.find(s => s.id === currentStudentId) || students[0];
      }, [students, currentStudentId]);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          const lines = text.split("\n").filter(l => l.trim() !== "");
          if (lines.length <= 1) return;

          const parsedStudents = lines.slice(1).map((line, idx) => {
            const parts = line.split(",").map(p => p.trim());
            const regNo = parts[0] || `143${100+idx}A`;
            const name = parts[1] || `Student ${idx+1}`;
            const mark1 = parseInt(parts[2]) || 70;
            const mark2 = parseInt(parts[3]) || 65;
            const mark3 = parseInt(parts[4]) || 80;

            return {
              id: `STU-CSV-${idx}`,
              regNo: regNo,
              name: name,
              password: "student@001",
              program: "Diploma in Software Development & IT",
              year: 2,
              semester: 1,
              gpa: (((mark1 + mark2 + mark3) / 3) / 20).toFixed(2),
              attendance: 90,
              feesDue: 12000,
              feesPaid: 40000,
              registeredUnits: ["CS201", "CS202", "CS203"],
              grades: [
                { code: "CS201", name: "Data Structures & Algorithms", mark: mark1, grade: mark1 >= 70 ? "A" : mark1 >= 60 ? "B" : "C" },
                { code: "CS202", name: "Database Systems", mark: mark2, grade: mark2 >= 70 ? "A" : mark2 >= 60 ? "B" : "C" },
                { code: "CS203", name: "Web Application Development", mark: mark3, grade: mark3 >= 70 ? "A" : mark3 >= 60 ? "B" : "C" }
              ],
              wellbeingStatus: "Good",
              notes: "Imported via CSV file."
            };
          });

          setStudents(parsedStudents);
          setCurrentStudentId(parsedStudents[0].id);
          alert(`Successfully loaded ${parsedStudents.length} students from CSV!`);
        };
        reader.readAsText(file);
      };

      const exportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,RegNo,Name,GPA,FeesDue,CS201_Mark,CS202_Mark,CS203_Mark\n";
        students.forEach(s => {
          const m1 = s.grades[0]?.mark || 0;
          const m2 = s.grades[1]?.mark || 0;
          const m3 = s.grades[2]?.mark || 0;
          csvContent += `${s.regNo},"${s.name}",${s.gpa},${s.feesDue},${m1},${m2},${m3}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Mosongo_School_Students_Report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const saveMarkEdit = (studentId, gradeIndex) => {
        const val = parseInt(editMarkValue);
        if (isNaN(val) || val < 0 || val > 100) {
          alert("Please enter a valid mark between 0 and 100.");
          return;
        }
        setStudents(prev => prev.map(s => {
          if (s.id !== studentId) return s;
          const newGrades = [...s.grades];
          const newGradeChar = val >= 70 ? "A" : val >= 60 ? "B" : val >= 50 ? "C" : val >= 40 ? "D" : "F";
          newGrades[gradeIndex] = { ...newGrades[gradeIndex], mark: val, grade: newGradeChar };
          
          const avg = newGrades.reduce((acc, g) => acc + g.mark, 0) / newGrades.length;
          const newGpa = (avg / 20).toFixed(2);

          return { ...s, grades: newGrades, gpa: newGpa };
        }));
        setEditingGradeIndex(null);
      };

      const toggleUnitRegistration = (unitCode) => {
        setStudents(prev => prev.map(s => {
          if (s.id !== currentStudent.id) return s;
          const isReg = s.registeredUnits.includes(unitCode);
          const updatedUnits = isReg 
            ? s.registeredUnits.filter(u => u !== unitCode)
            : [...s.registeredUnits, unitCode];
          return { ...s, registeredUnits: updatedUnits };
        }));
      };

      const processFeePayment = (e) => {
        e.preventDefault();
        const amt = parseFloat(paymentAmount);
        if (isNaN(amt) || amt <= 0) {
          alert("Enter a valid payment amount!");
          return;
        }
        setStudents(prev => prev.map(s => {
          if (s.id !== currentStudent.id) return s;
          const newDue = Math.max(0, s.feesDue - amt);
          const newPaid = s.feesPaid + amt;
          return { ...s, feesDue: newDue, feesPaid: newPaid };
        }));
        setPaymentAmount("");
        alert(`Payment of KES ${amt.toLocaleString()} processed successfully!`);
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen bg-slate-950">
          
          {/* SIDEBAR */}
          <aside className="w-full md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
            <div>
              <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white text-xl shadow-lg shadow-indigo-500/20">
                  M
                </div>
                <div>
                  <h1 className="font-bold text-lg text-white leading-tight">Mosongo School</h1>
                  <p className="text-xs text-indigo-400 font-medium">Student Management System</p>
                </div>
              </div>

              <div className="p-4 bg-slate-800/50 m-4 rounded-xl border border-slate-700/50">
                <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">
                  Active Account
                </label>
                <select 
                  value={currentStudentId} 
                  onChange={(e) => setCurrentStudentId(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                >
                  {students.map(s => (
                    <option key={s.id} value={s.id}>
                      {s.regNo} - {s.name}
                    </option>
                  ))}
                </select>
                <div className="mt-2 text-xs text-slate-400 flex justify-between">
                  <span>Pass: <strong className="text-slate-200">{currentStudent.password}</strong></span>
                  <span className="text-emerald-400 font-semibold">{currentStudent.regNo}</span>
                </div>
              </div>

              <nav className="px-4 space-y-1">
                <button 
                  onClick={() => setActiveTab("dashboard")} 
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                >
                  📊 Dashboard Overview
                </button>
                <button 
                  onClick={() => setActiveTab("academics")} 
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'academics' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                >
                  📚 Academics & Grades
                </button>
                <button 
                  onClick={() => setActiveTab("register")} 
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'register' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                >
                  📝 Course Registration
                </button>
                <button 
                  onClick={() => setActiveTab("fees")} 
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'fees' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                >
                  💳 Fees & Payments
                </button>
                <button 
                  onClick={() => setActiveTab("wellbeing")} 
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'wellbeing' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                >
                  🌱 Student Wellbeing
                </button>
                {isAdmin && (
                  <button 
                    onClick={() => setActiveTab("admin")} 
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeTab === 'admin' ? 'bg-amber-600 text-white' : 'text-amber-400 hover:bg-amber-950/40'}`}
                  >
                    ⚙️ Master Admin Panel
                  </button>
                )}
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800 space-y-3">
              <div className="flex items-center justify-between p-2 rounded-lg bg-slate-900 border border-slate-800">
                <span className="text-xs font-semibold text-slate-300">Admin Privileges</span>
                <button 
                  onClick={() => setIsAdmin(!isAdmin)}
                  className={`px-3 py-1 rounded-full text-xs font-bold transition ${isAdmin ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}
                >
                  {isAdmin ? 'ADMIN ON' : 'STUDENT'}
                </button>
              </div>

              {isAdmin && (
                <div className="space-y-2">
                  <label className="block text-center w-full cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs py-2 font-medium transition">
                    📂 Upload CSV Excel File
                    <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />
                  </label>
                  <button 
                    onClick={exportCSV} 
                    className="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 rounded-lg text-xs py-2 font-medium transition"
                  >
                    📥 Export Records (CSV)
                  </button>
                </div>
              )}
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 bg-slate-950 p-6 md:p-10 overflow-y-auto">
            
            <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 pb-6 border-b border-slate-800">
              <div>
                <h2 className="text-2xl font-bold text-white">Welcome back, {currentStudent.name}</h2>
                <p className="text-slate-400 text-sm">Reg No: <span className="text-indigo-400 font-mono font-semibold">{currentStudent.regNo}</span> | Year {currentStudent.year}, Semester {currentStudent.semester}</p>
              </div>
              <div className="flex items-center gap-3">
                <span className="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
                  Status: Active Student
                </span>
                {isAdmin && (
                  <span className="px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-semibold">
                    Admin Mode Engaged
                  </span>
                )}
              </div>
            </header>

            {activeTab === "dashboard" && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <p className="text-slate-400 text-xs font-medium">Cumulative GPA</p>
                    <h3 className="text-3xl font-bold text-indigo-400 mt-1">{currentStudent.gpa}</h3>
                    <p className="text-emerald-400 text-xs mt-2">Good Academic Standing</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <p className="text-slate-400 text-xs font-medium">Registered Units</p>
                    <h3 className="text-3xl font-bold text-white mt-1">{currentStudent.registeredUnits.length} Units</h3>
                    <p className="text-indigo-400 text-xs mt-2">Semester 1 Active</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <p className="text-slate-400 text-xs font-medium">Outstanding Fees</p>
                    <h3 className={`text-3xl font-bold mt-1 ${currentStudent.feesDue > 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                      KES {currentStudent.feesDue.toLocaleString()}
                    </h3>
                    <p className="text-slate-400 text-xs mt-2">{currentStudent.feesDue > 0 ? 'Payment Required' : 'Fully Cleared'}</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <p className="text-slate-400 text-xs font-medium">Attendance Rate</p>
                    <h3 className="text-3xl font-bold text-emerald-400 mt-1">{currentStudent.attendance}%</h3>
                    <p className="text-slate-400 text-xs mt-2">Threshold: 75% Required</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <h3 className="text-lg font-bold text-white mb-4">📢 Mosongo School Announcements</h3>
                    <div className="space-y-4">
                      <div className="p-4 rounded-lg bg-slate-800/40 border border-slate-700/40">
                        <div className="flex justify-between text-xs text-indigo-400 mb-1 font-semibold">
                          <span>ACADEMIC NOTICE</span>
                          <span>Nov 03, 2026</span>
                        </div>
                        <h4 className="font-semibold text-slate-100">Semester Unit Registration Deadline</h4>
                        <p className="text-sm text-slate-400 mt-1">
                          All students are advised to finalize course registration for Semester 1 by Friday. Ensure fee balance is cleared before requesting registration slip signature.
                        </p>
                      </div>
                      <div className="p-4 rounded-lg bg-slate-800/40 border border-slate-700/40">
                        <div className="flex justify-between text-xs text-amber-400 mb-1 font-semibold">
                          <span>EXAMINATION SCHEDULE</span>
                          <span>Nov 01, 2026</span>
                        </div>
                        <h4 className="font-semibold text-slate-100">End-of-Term Practical Exams</h4>
                        <p className="text-sm text-slate-400 mt-1">
                          Practical exams for Web Development & Database Systems will commence next week in Computer Lab A.
                        </p>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col justify-between">
                    <div>
                      <h3 className="text-lg font-bold text-white mb-2">🌱 Student Wellbeing</h3>
                      <p className="text-sm text-slate-400">Your current status recorded by student care:</p>
                      <div className="mt-4 p-4 rounded-lg bg-emerald-950/40 border border-emerald-800/50">
                        <span className="text-xs text-emerald-400 font-semibold block uppercase">Status</span>
                        <span className="text-xl font-bold text-emerald-300">{currentStudent.wellbeingStatus}</span>
                        <p className="text-xs text-slate-400 mt-1">{currentStudent.notes}</p>
                      </div>
                    </div>
                    <button 
                      onClick={() => setActiveTab("wellbeing")}
                      className="mt-6 w-full py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition"
                    >
                      Access Support Desk
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === "academics" && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h3 className="text-xl font-bold text-white">Academic Performance & Transcript</h3>
                  <button onClick={() => window.print()} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg">
                    🖨️ Print Transcript
                  </button>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                  <table className="w-full text-left text-sm text-slate-300">
                    <thead className="bg-slate-800 text-slate-400 text-xs uppercase font-semibold">
                      <tr>
                        <th className="p-4">Unit Code</th>
                        <th className="p-4">Unit Description</th>
                        <th className="p-4">Mark (%)</th>
                        <th className="p-4">Grade</th>
                        <th className="p-4">Status</th>
                        {isAdmin && <th className="p-4">Admin Action</th>}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {currentStudent.grades.map((g, idx) => (
                        <tr key={g.code} className="hover:bg-slate-800/30">
                          <td className="p-4 font-mono font-semibold text-indigo-400">{g.code}</td>
                          <td className="p-4 font-medium text-white">{g.name}</td>
                          <td className="p-4 font-semibold">
                            {editingGradeIndex === idx && isAdmin ? (
                              <input 
                                type="number" 
                                value={editMarkValue} 
                                onChange={(e) => setEditMarkValue(e.target.value)}
                                className="w-16 bg-slate-800 border border-indigo-500 text-white rounded p-1 text-xs"
                              />
                            ) : (
                              `${g.mark}%`
                            )}
                          </td>
                          <td className="p-4 font-bold text-emerald-400">{g.grade}</td>
                          <td className="p-4">
                            <span className="px-2 py-0.5 rounded text-xs bg-emerald-950 text-emerald-400 font-semibold border border-emerald-800">
                              Passed
                            </span>
                          </td>
                          {isAdmin && (
                            <td className="p-4">
                              {editingGradeIndex === idx ? (
                                <button 
                                  onClick={() => saveMarkEdit(currentStudent.id, idx)}
                                  className="px-3 py-1 bg-emerald-600 text-white rounded text-xs font-bold"
                                >
                                  Save
                                </button>
                              ) : (
                                <button 
                                  onClick={() => { setEditingGradeIndex(idx); setEditMarkValue(g.mark); }}
                                  className="px-3 py-1 bg-amber-600/30 hover:bg-amber-600 border border-amber-500 text-amber-300 hover:text-white rounded text-xs font-medium"
                                >
                                  Edit Mark
                                </button>
                              )}
                            </td>
                          )}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === "register" && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h3 className="text-xl font-bold text-white">Semester 1 Unit Registration</h3>
                    <p className="text-xs text-slate-400 mt-1">Select the units you are attending this semester.</p>
                  </div>
                  <button onClick={() => window.print()} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold rounded-lg">
                    🖨️ Print Exam Slip
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {AVAILABLE_UNITS.map(unit => {
                    const isRegistered = currentStudent.registeredUnits.includes(unit.code);
                    return (
                      <div key={unit.code} className={`p-5 rounded-xl border transition ${isRegistered ? 'bg-indigo-950/20 border-indigo-600/50' : 'bg-slate-900 border-slate-800'}`}>
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-xs font-mono font-bold text-indigo-400">{unit.code}</span>
                            <h4 className="font-bold text-white text-base mt-1">{unit.name}</h4>
                            <p className="text-xs text-slate-400 mt-1">Lecturer: {unit.lecturer} | Credits: {unit.credit}</p>
                          </div>
                          <button 
                            onClick={() => toggleUnitRegistration(unit.code)}
                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${isRegistered ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                          >
                            {isRegistered ? 'Registered ✓' : '+ Register'}
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div id="printable-slip" className="hidden print:block p-8 bg-white text-slate-900">
                  <h1 className="text-2xl font-bold text-center border-b pb-2">MOSONGO SCHOOL</h1>
                  <h2 className="text-center font-semibold text-slate-700 mt-1">Official Semester Unit Registration Slip</h2>
                  <div className="mt-6 space-y-1 text-sm">
                    <p><strong>Student Name:</strong> {currentStudent.name}</p>
                    <p><strong>Registration Number:</strong> {currentStudent.regNo}</p>
                    <p><strong>Program:</strong> {currentStudent.program}</p>
                    <p><strong>Academic Year:</strong> 2026 / 2027</p>
                  </div>
                  <table className="w-full mt-6 text-left text-sm border-collapse border border-slate-300">
                    <thead>
                      <tr className="bg-slate-100">
                        <th className="border p-2">Unit Code</th>
                        <th className="border p-2">Unit Name</th>
                        <th className="border p-2">Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      {currentStudent.registeredUnits.map(code => {
                        const u = AVAILABLE_UNITS.find(item => item.code === code);
                        return (
                          <tr key={code}>
                            <td className="border p-2 font-mono">{code}</td>
                            <td className="border p-2">{u ? u.name : 'Core Unit'}</td>
                            <td className="border p-2">Confirmed</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  <div className="mt-12 flex justify-between text-xs pt-8 border-t">
                    <p>Student Signature: _______________________</p>
                    <p>Dean's Stamp & Date: _______________________</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === "fees" && (
              <div className="space-y-6">
                <h3 className="text-xl font-bold text-white">Financial Statement & Fee Portal</h3>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
                    <h4 className="text-slate-400 text-xs font-semibold uppercase">Account Balance</h4>
                    <div>
                      <span className="text-3xl font-bold text-white">KES {currentStudent.feesDue.toLocaleString()}</span>
                      <p className="text-xs text-slate-400 mt-1">Total Outstanding</p>
                    </div>
                    <div className="pt-4 border-t border-slate-800 space-y-2 text-xs">
                      <div className="flex justify-between text-slate-400">
                        <span>Total Tuition Charged:</span>
                        <span className="text-white font-medium">KES {(currentStudent.feesPaid + currentStudent.feesDue).toLocaleString()}</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>Total Amount Paid:</span>
                        <span className="text-emerald-400 font-medium">KES {currentStudent.feesPaid.toLocaleString()}</span>
                      </div>
                    </div>
                  </div>

                  <div className="md:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-xl">
                    <h4 className="text-lg font-bold text-white mb-4">💳 Initiate Fee Payment</h4>
                    <form onSubmit={processFeePayment} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Payment Amount (KES)</label>
                        <input 
                          type="number" 
                          value={paymentAmount}
                          onChange={(e) => setPaymentAmount(e.target.value)}
                          placeholder="e.g. 5000"
                          className="w-full bg-slate-950 border border-slate-700 text-white rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        />
                      </div>
                      <div className="flex gap-3">
                        <button type="button" onClick={() => setPaymentAmount(currentStudent.feesDue)} className="px-3 py-2 bg-slate-800 text-xs text-slate-300 rounded-lg hover:bg-slate-700">
                          Pay Full Balance
                        </button>
                        <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm transition">
                          Process M-Pesa / Bank Payment
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            )}

            {activeTab === "wellbeing" && (
              <div className="space-y-6">
                <h3 className="text-xl font-bold text-white">Student Support & Mental Wellbeing</h3>
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                  <h4 className="text-lg font-bold text-indigo-400 mb-2">Mosongo Care & Support Desk</h4>
                  <p className="text-sm text-slate-400 mb-6">
                    If you require academic guidance, financial advice, or personal counselling support, submit a quick check-in below.
                  </p>
                  <div className="space-y-4 max-w-lg">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">How are you feeling today?</label>
                      <select className="w-full bg-slate-950 border border-slate-700 text-white rounded-lg p-3 text-sm">
                        <option>🟢 Feeling Great & Ready</option>
                        <option>🟡 Slightly Stressed / Exam Pressure</option>
                        <option>🔴 Need Assistance / Urgent Support</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Optional Note for Counselor</label>
                      <textarea placeholder="Write a brief message..." className="w-full bg-slate-950 border border-slate-700 text-white rounded-lg p-3 text-sm h-24"></textarea>
                    </div>
                    <button onClick={() => alert("Check-in submitted to Mosongo School Counselor.")} className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-sm">
                      Submit Check-In
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === "admin" && isAdmin && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h3 className="text-xl font-bold text-amber-400">Master Administrative Controls</h3>
                    <p className="text-xs text-slate-400 mt-1">Manage all 16 registered students, override marks, and view credentials.</p>
                  </div>
                  <button onClick={exportCSV} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg">
                    📥 Download Master CSV
                  </button>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                  <table className="w-full text-left text-sm text-slate-300">
                    <thead className="bg-slate-800 text-slate-400 text-xs uppercase font-semibold">
                      <tr>
                        <th className="p-4">Reg No</th>
                        <th className="p-4">Student Name</th>
                        <th className="p-4">Password</th>
                        <th className="p-4">GPA</th>
                        <th className="p-4">Fee Due</th>
                        <th className="p-4">Quick Switch</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {students.map(s => (
                        <tr key={s.id} className="hover:bg-slate-800/40">
                          <td className="p-4 font-mono font-bold text-amber-400">{s.regNo}</td>
                          <td className="p-4 font-medium text-white">{s.name}</td>
                          <td className="p-4 font-mono text-slate-400">{s.password}</td>
                          <td className="p-4 font-semibold text-indigo-400">{s.gpa}</td>
                          <td className="p-4 font-semibold text-amber-300">KES {s.feesDue.toLocaleString()}</td>
                          <td className="p-4">
                            <button 
                              onClick={() => { setCurrentStudentId(s.id); setActiveTab("academics"); }}
                              className="px-3 py-1 bg-indigo-600/30 hover:bg-indigo-600 border border-indigo-500 text-indigo-300 hover:text-white rounded text-xs font-medium"
                            >
                              Manage Marks
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
